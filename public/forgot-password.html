<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | BCSM ERP</title>
    <style>
        /* --- CLASSIC STYLES --- */
        body { 
            font-family: 'Times New Roman', serif; 
            background-color: #f4f4f4; 
            padding: 2em; 
            display: grid; 
            place-items: center; 
            min-height: 100vh; 
            margin: 0;
        }
        .container { 
            max-width: 400px; 
            width: 100%;
            padding: 30px; 
            background: white; 
            border: 2px solid #333; 
            box-shadow: 6px 6px 0 #AAA; 
        }
        h2 { 
            color: #000; 
            font-weight: bold; 
            border-bottom: 2px dotted #999; 
            padding-bottom: 10px; 
            margin-top: 0;
            margin-bottom: 20px; 
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { 
            width: 100%; 
            box-sizing: border-box;
            border: 1px solid #555; 
            padding: 12px; 
            font-size: 1rem;
        }
        button { 
            width: 100%;
            background-color: #005A9C; 
            color: white; 
            border: 2px solid #000; 
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000;
            transition: all 0.2s;
        }
        button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000; }
        button:disabled { background-color: #666; cursor: not-allowed; box-shadow: none; }
        #message { font-weight: bold; min-height: 1.2em; font-size: 0.9rem; }
        .back-to-login a { color: #005A9C; text-decoration: none; font-weight: bold; }
        .back-to-login a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Forgot Your Password?</h2>
        <p style="font-size: 0.9rem; color: #555;">Enter your registered email address and we will send you a secure link to reset your password.</p>
        
        <form id="forgot-password-form">
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required autocomplete="email">
            </div>
            <button type="submit" id="submit-btn">Send Reset Link</button>
        </form>

        <div id="message" style="margin-top: 20px; text-align: center;"></div>
        
        <div class="back-to-login" style="text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
            <a href="/login.html">← Back to Login</a>
        </div>
    </div>



<script>
document.getElementById('forgot-password-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const emailInput = document.getElementById('email');
    const submitBtn = document.getElementById('submit-btn');
    const messageDiv = document.getElementById('message');
    
    const email = emailInput.value.trim();
    
    // UI Reset - সাবমিট শুরু
    messageDiv.textContent = '⏳ Processing request...'; 
    messageDiv.style.color = '#333';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending Email...';
    
    try {
        const response = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });
        
        const data = await response.json().catch(() => ({}));
        
        if (response.ok) {
            messageDiv.style.color = '#27ae60'; // Success Green
            messageDiv.innerHTML = '✅ ' + (data.message || "Reset link sent successfully! Check your inbox."); 
            emailInput.value = ''; // ক্লিয়ার ইনপুট
        } else {
            messageDiv.style.color = '#c0392b'; // Error Red
            messageDiv.textContent = '❌ ' + (data.message || "Failed to send link. Please verify your email.");
        }
    } catch (err) {
        messageDiv.style.color = '#c0392b';
        messageDiv.textContent = '⚠️ Network error. Please check your connection or try again.';
    } finally {
        // বাটন আবার সক্রিয় করা যাতে এরর হলে ইউজার আবার ট্রাই করতে পারে
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
    }
});
</script>
<script src="js/global-config.js"></script>
</body>
</html>
