<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bulk Smart ID Cards Print | BCSM Enterprise</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Montserrat:wght@400;600;700;800&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-body: #475569; 
            --card-bg: #ffffff;
            --primary: #0f172a;
            --accent: #2563eb;
            --gold: #f59e0b;
            --text-dark: #0f172a;
            --card-w: 324px;
            --card-h: 204px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-body);
            padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        .controls-bar {
            background: white; padding: 10px 20px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-bottom: 20px;
            display: flex; gap: 20px; align-items: center; width: 210mm;
            justify-content: space-between; border: 1px solid #e2e8f0;
        }

        .btn-print {
            background: var(--accent); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: 800; text-transform: uppercase;
        }

        .a4-page {
            width: 210mm; min-height: 297mm;
            background: white; padding: 10mm;
            margin-bottom: 25px; display: grid; grid-template-columns: 1fr 1fr;
            grid-auto-rows: max-content; gap: 10mm; page-break-after: always;
        }

        .card-pair-wrapper {
            display: flex; flex-direction: column; gap: 5px;
            break-inside: avoid; border: 1px dashed #cbd5e1; padding: 5px; border-radius: 8px;
        }

        .id-card {
            width: var(--card-w); height: var(--card-h);
            background: var(--card-bg); border-radius: 10px; position: relative; overflow: hidden;
            border: 1px solid #cbd5e1; 
            background-image: radial-gradient(#cbd5e1 0.5px, transparent 0.5px); background-size: 8px 8px;
        }

        .strip-container {
            position: absolute; left: 0; top: 0; bottom: 0; width: 60px;
            background: linear-gradient(170deg, #0f172a, #1e293b); z-index: 2;
            display: flex; flex-direction: column; align-items: center; padding-top: 15px;
        }

        .smart-chip {
            width: 28px; height: 20px; background: linear-gradient(135deg, #fbbf24, #b45309);
            border-radius: 4px; border: 1px solid #92400e; margin-bottom: 20px;
        }

        .v-text {
            writing-mode: vertical-rl; transform: rotate(180deg);
            font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px;
            color: rgba(255,255,255,0.08); letter-spacing: 3px; margin-top: auto; margin-bottom: 15px;
        }

        .front-body { margin-left: 60px; padding: 10px; height: 100%; display: flex; flex-direction: column; }
        .f-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
        .logo-hold img { height: 26px; max-width: 130px; object-fit: contain; }
        .validity-badge { background: #0f172a; color: #fff; padding: 2px 5px; border-radius: 3px; font-size: 6px; font-weight: 800; }
        
        .profile-grid { display: flex; gap: 8px; align-items: center; flex: 1; }
        
        .avatar-box {
            width: 75px; height: 75px; border-radius: 50%; border: 2px solid #fff;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1); overflow: hidden; background: #f1f5f9; flex-shrink: 0;
        }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-box { flex: 1; text-align: left; overflow: hidden; }
        
        /* ফন্ট সাইজ কমানো হলো */
        .st-name { font-size: 10.5px; font-weight: 800; color: #0f172a; text-transform: uppercase; margin-bottom: 2px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .st-meta { font-size: 7px; font-weight: 700; color: #2563eb; text-transform: uppercase; display: block; margin-bottom: 5px; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .d-row { display: flex; font-size: 7px; margin-bottom: 1.5px; line-height: 1; }
        .d-lbl { color: #64748b; width: 35px; font-weight: 600; }
        .d-val { color: #0f172a; font-weight: 800; text-transform: uppercase; }

        .f-footer { margin-top: auto; border-top: 1.5px solid var(--gold); padding-top: 3px; }
        .branch-name-txt { font-size: 8px; font-weight: 900; color: #0f172a; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .back-body { padding: 10px 15px; height: 100%; display: flex; flex-direction: column; }
        .codes { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
        .qr-wrap { background: white; padding: 2px; border: 1px solid #e2e8f0; border-radius: 4px; width: 40px; height: 40px; }
        .bar-wrap { flex: 1; text-align: right; overflow: hidden; }
        .bar-wrap svg { height: 28px; width: 100%; }
        
        .contact-row { font-size: 6.5px; color: #1e293b; margin-bottom: 2px; display: flex; align-items: center; gap: 4px; font-weight: 500; }
        .contact-row i { color: #2563eb; width: 10px; font-size: 8px; }
        
        .disclaimer { font-size: 5.5px; color: #64748b; text-align: justify; margin-top: auto; padding-top: 4px; border-top: 1px dashed #e2e8f0; line-height: 1.2; }
        
        .sign-grid { display: flex; justify-content: space-between; margin-top: 6px; }
        .sign-col { text-align: center; width: 75px; }
        .sign-font { font-family: 'Great Vibes', cursive; font-size: 14px; height: 18px; border-bottom: 1px solid #94a3b8; color: #0f172a; }
        .sign-lbl { font-size: 6px; font-weight: 800; text-transform: uppercase; margin-top: 3px; color: #475569; }

        @media print {
            body { background: white; padding: 0; }
            .controls-bar { display: none; }
            .a4-page { box-shadow: none; margin: 0; border: none; padding: 10mm; }
            * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>
</head>
<body>

    <div class="controls-bar">
        <div id="status-msg">Processing Bulk ID Cards...</div>
        <button onclick="window.print()" class="btn-print" id="print-btn" disabled>Print All Cards</button>
    </div>

    <div id="pages-container"></div>

    <script src="js/global-config.js"></script>
    <script>
        const API_BASE_URL = window.API_BASE_URL || 'http://localhost:3005';
        const token = localStorage.getItem('erp-token');
        const container = document.getElementById('pages-container');
        const statusMsg = document.getElementById('status-msg');
        const printBtn = document.getElementById('print-btn');

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const idsParam = urlParams.get('ids');
            if (!token) { window.location.href = '/login.html'; return; }
            if (!idsParam) { statusMsg.innerHTML = "No selection found!"; return; }

            const ids = idsParam.split(',');
            statusMsg.innerHTML = `Loading ${ids.length} Profiles...`;
            await processBulkCards(ids);
        };

        async function processBulkCards(ids) {
            let currentPage = createNewPage();
            container.appendChild(currentPage);
            const CARDS_PER_PAGE = 4;
            let count = 0;

            for (const id of ids) {
                if (count > 0 && count % CARDS_PER_PAGE === 0) {
                    currentPage = createNewPage();
                    container.appendChild(currentPage);
                }

                try {
                    const res = await fetch(`${API_BASE_URL}/api/students/${id}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const student = await res.json();
                    
                    const bcUid = `bc-${id}`;
                    const qrUid = `qr-${id}`;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-pair-wrapper';
                    wrapper.innerHTML = renderCardHTML(student, bcUid, qrUid);
                    currentPage.appendChild(wrapper);

                    generateGraphics(student.admission_id, bcUid, qrUid);
                    count++;
                } catch (err) { console.error("Error fetching student:", id); }
            }
            statusMsg.innerHTML = `Success: ${count} Cards Generated. Ready to Print.`;
            printBtn.disabled = false;
        }

        function createNewPage() {
            const div = document.createElement('div');
            div.className = 'a4-page';
            return div;
        }

        function renderCardHTML(data, bcUid, qrUid) {
            const baseUrl = 'http://localhost:3005';
            const resolveImg = (p) => {
                if (!p) return 'images/default-avatar.png';
                if (p.length > 500) return p.includes('data:image') ? p : `data:image/jpeg;base64,${p}`;
                return p.startsWith('http') ? p : `${baseUrl}/${p.replace(/^\/+/, '')}`;
            };
            
            const bName = data.branch_name || "BCSM INSTITUTE";
            const bAddr = data.branch_address || "Address Missing";
            const photo = resolveImg(data.profile_image_path);
            const logo = resolveImg(data.branch_logo || data.logo_url);

            return `
            <div class="id-card">
                <div class="strip-container">
                    <div class="smart-chip"></div>
                    <div class="v-text">STUDENT</div>
                </div>
                <div class="front-body">
                    <div class="f-header">
                        <div class="logo-hold"><img src="${logo}" onerror="this.src='images/default-logo.png'"></div>
                        <div class="validity-badge">2025-26</div>
                    </div>
                    <div class="profile-grid">
                        <div class="avatar-box"><img src="${photo}" onerror="this.src='images/default-avatar.png'"></div>
                        <div class="info-box">
                            <div class="st-name">${data.first_name} ${data.last_name}</div>
                            <span class="st-meta">${data.course_name || 'STUDENT'}</span>
                            <div class="d-row"><span class="d-lbl">ID</span> <span class="d-val">${data.admission_id}</span></div>
                            <div class="d-row"><span class="d-lbl">DOB</span> <span class="d-val">${data.dob ? new Date(data.dob).toLocaleDateString('en-GB') : '-'}</span></div>
                            <div class="d-row"><span class="d-lbl">BLOOD</span> <span class="d-val">${data.blood_group || '-'}</span></div>
                        </div>
                    </div>
                    <div class="f-footer"><div class="branch-name-txt">${bName}</div></div>
                </div>
            </div>
            <div class="id-card">
                <div class="back-body">
                    <div class="codes">
                        <div class="qr-wrap" id="${qrUid}"></div>
                        <div class="bar-wrap"><svg id="${bcUid}"></svg></div>
                    </div>
                    <div class="contact-row"><i class="fas fa-map-marker-alt"></i> ${bAddr}</div>
                    <div class="contact-row"><i class="fas fa-envelope"></i> ${data.branch_email || 'info@bcsm.com'}</div>
                    <div class="contact-row"><i class="fas fa-phone-alt"></i> ${data.phone_number || 'N/A'}</div>
                    <div class="disclaimer">Property of ${bName}. If found, return to office.</div>
                    <div class="sign-grid">
                        <div class="sign-col"><div class="sign-font">${data.parent_first_name || ''}</div><div class="sign-lbl">Guardian</div></div>
                        <div class="sign-col"><div class="sign-font"></div><div class="sign-lbl">Principal</div></div>
                    </div>
                </div>
            </div>`;
        }

        function generateGraphics(id, bcUid, qrUid) {
            JsBarcode(`#${bcUid}`, id.toString(), {
                format: "CODE128", width: 1.4, height: 30, displayValue: false, margin: 0, lineColor: "#0f172a"
            });
            new QRCode(document.getElementById(qrUid), {
                text: `${window.location.origin}/verify/${id}`,
                width: 40, height: 40, correctLevel: QRCode.CorrectLevel.M
            });
        }
    </script>
</body>
</html>
