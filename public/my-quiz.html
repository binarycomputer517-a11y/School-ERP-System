<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Quizzes | DCA Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            background-color: #f8fafc; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #1e293b;
        }

        /* Header Style */
        .page-header {
            padding-bottom: 2rem;
        }

        @media (max-width: 576px) {
            .page-header {
                text-align: center;
                flex-direction: column;
                gap: 1.5rem;
            }
            h2 { font-size: 1.4rem; }
        }

        /* Quiz Card Enhancements */
        .quiz-card { 
            border-radius: 20px; 
            border: 1px solid rgba(0,0,0,0.05); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
            transition: all 0.3s ease;
            background: #ffffff;
            position: relative;
        }

        .quiz-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.1);
            border-color: #6366f1;
        }

        .badge-published {
            background: rgba(16, 185, 129, 0.1);
            color: #059669;
            font-size: 0.7rem;
            letter-spacing: 1px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .badge-completed {
            background: rgba(99, 102, 241, 0.1);
            color: #4f46e5;
            font-size: 0.7rem;
            letter-spacing: 1px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 8px;
        }

        /* Buttons */
        .btn-start { 
            background: #6366f1; 
            color: white; 
            border-radius: 12px; 
            font-weight: 700; 
            border: none;
            padding: 12px;
            transition: 0.3s; 
        }

        .btn-start:hover { 
            background: #4f46e5; 
            color: white;
        }

        .btn-report {
            background: #1e293b;
            color: white;
            border-radius: 12px;
            font-weight: 700;
            padding: 12px;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: 0.3s;
        }
        
        .btn-report:hover {
            background: #0f172a;
            color: white;
        }

        .btn-dashboard {
            border-radius: 12px;
            font-weight: 600;
            transition: 0.3s;
        }

        /* Loading Spinner */
        .loader-container {
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container py-4 py-md-5">
        <header class="d-flex justify-content-between align-items-center page-header">
            <div>
                <h2 class="fw-800 mb-1" id="header-title">Online Assessments</h2>
                <p class="text-muted mb-0" id="header-subtitle">Manage and attempt your active quizzes</p>
            </div>
            <a href="/student-dashboard.html" id="dashboard-btn" class="btn btn-outline-dark btn-dashboard px-4">
                <i class="fas fa-th-large me-2"></i> Dashboard
            </a>
        </header>

        <div id="quiz-list-container" class="row g-3 g-md-4">
            <div class="col-12 loader-container">
                <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
                <p class="mt-3 text-muted fw-600">Syncing with academic server...</p>
            </div>
        </div>
    </div>

    <script src="/js/global-config.js"></script>
    <script>
        const TOKEN = localStorage.getItem('erp-token');

        /**
         * Resolves identity for Student or Parent
         */
        function getAuthContext() {
            if (!TOKEN) return null;
            try {
                const payload = JSON.parse(atob(TOKEN.split('.')[1]));
                const role = payload.role.toLowerCase();
                return {
                    role: role,
                    // If parent, use selected child ID; if student, use self ID
                    studentId: role === 'parent' 
                               ? localStorage.getItem('selected-student-id') 
                               : (payload.student_id || payload.id || localStorage.getItem('profile-id'))
                };
            } catch (e) { return null; }
        }

        const context = getAuthContext();

        async function fetchQuizzes() {
            const container = document.getElementById('quiz-list-container');
            
            if (!TOKEN) {
                window.location.href = '/login.html';
                return;
            }

            // UI Adjustment for Parent Role
            if (context.role === 'parent') {
                document.getElementById('header-title').innerText = "Child's Assessments";
                document.getElementById('header-subtitle').innerText = "Monitor quiz attempts and reports";
                document.getElementById('dashboard-btn').href = "/parent-dashboard.html";
            }

            if (!context.studentId) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-warning border-0 shadow-sm rounded-4 p-4 text-center">
                            <i class="fas fa-user-slash fa-2x mb-3"></i>
                            <h5 class="fw-bold">Student Identity Missing</h5>
                            <p class="mb-0">Please select a student from the dashboard to continue.</p>
                        </div>
                    </div>`;
                return;
            }

            try {
                // 
                const res = await fetch(`/api/online-exam/student/${context.studentId}/quizzes`, {
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });

                const data = await res.json();
                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <img src="https://cdn-icons-png.flaticon.com/512/6108/6108830.png" width="80" class="mb-3 opacity-50">
                            <h4 class="text-muted">No active quizzes found.</h4>
                            <p class="small text-secondary">Contact your institution if you think this is a mistake.</p>
                        </div>`;
                    return;
                }

                data.forEach(quiz => {
                    const isAttempted = quiz.attempt_status === 'Submitted';
                    const isParent = context.role === 'parent';

                    container.innerHTML += `
                        <div class="col-12 col-md-6 col-lg-4">
                            <div class="card quiz-card p-4 h-100">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <span class="${isAttempted ? 'badge-completed' : 'badge-published'}">
                                        ${isAttempted ? 'COMPLETED' : 'PUBLISHED'}
                                    </span>
                                    <i class="fas fa-file-signature text-primary opacity-25 fa-2x"></i>
                                </div>
                                
                                <h4 class="fw-bold mb-1">${quiz.title}</h4>
                                <p class="text-muted small mb-4">Subject: ${quiz.subject_name || 'General'}</p>
                                
                                <div class="row g-0 border-top pt-3 mb-4">
                                    <div class="col-6 border-end">
                                        <div class="ps-2">
                                            <small class="d-block text-muted">Time Limit</small>
                                            <span class="fw-bold"><i class="far fa-clock me-1"></i> ${quiz.time_limit} Min</span>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="ps-3">
                                            <small class="d-block text-muted">Total Marks</small>
                                            <span class="fw-bold"><i class="fas fa-star me-1 text-warning"></i> ${quiz.max_marks || 100}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                ${isAttempted ? 
                                    `<a href="/assessment-report.html?quizId=${quiz.id}" class="btn-report w-100 shadow-sm">
                                        VIEW REPORT CARD <i class="fas fa-file-contract ms-2 small"></i>
                                    </a>` : 
                                    (isParent ? 
                                        `<button class="btn btn-secondary w-100" disabled style="border-radius: 12px; font-weight:700;">
                                            PENDING ATTEMPT
                                        </button>` :
                                        `<button onclick="startQuiz('${quiz.id}')" class="btn btn-start w-100 shadow-sm">
                                            START ASSESSMENT <i class="fas fa-chevron-right ms-2 small"></i>
                                        </button>`
                                    )
                                }
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                container.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-danger rounded-4">
                            <strong>Sync Error:</strong> ${err.message}. Please verify academic server status.
                        </div>
                    </div>`;
            }
        }

        function startQuiz(quizId) {
            if(confirm("Are you ready to start this assessment? Once started, the system will track your progress and violations.")) {
                window.location.href = `/student-quiz-attempt.html?quizId=${quizId}`;
            }
        }

        document.addEventListener('DOMContentLoaded', fetchQuizzes);
    </script>
</body>
</html>
