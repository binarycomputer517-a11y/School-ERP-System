<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Staff | BCSM Enterprise</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --primary-dark: #005A9C; }
        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--primary-dark);
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-top: 25px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .branch-badge {
            background: #fff3cd;
            color: #856404;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            border: 1px solid #ffeeba;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="container" style="max-width: 1100px; padding-top: 30px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold text-dark mb-0"><i class="fas fa-user-plus me-2 text-primary"></i>Register New Staff</h2>
            <div class="d-flex align-items-center gap-2 mt-1">
                <span class="branch-badge">
                    <i class="fas fa-university me-1"></i> 
                    Branch: <span id="current-branch-name">Locating Campus...</span>
                </span>
            </div>
        </div>
        <div class="d-flex gap-2">
            <a href="/view-teachers.html" class="btn btn-secondary btn-sm rounded-pill px-3">
                <i class="fas fa-arrow-left me-2"></i> Staff Directory
            </a>
            <a href="/manage-departments.html" class="btn btn-info text-white btn-sm rounded-pill px-3 shadow-sm">
                <i class="fas fa-building me-2"></i> Departments
            </a>
        </div>
    </div>

    <div class="glass-card">
        <form id="add-teacher-form" enctype="multipart/form-data">
            <input type="hidden" id="branch_id" name="branch_id">
            
            <h5 class="section-title"><i class="fas fa-briefcase me-2"></i>Employment Details</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-bold small">Full Name <span class="text-danger">*</span></label>
                    <input type="text" name="full_name" class="form-control" required placeholder="Full Legal Name">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold small">Employee ID <span class="text-danger">*</span></label>
                    <input type="text" name="employee_id" class="form-control" required placeholder="e.g. BCSM-501">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold small">Designation</label>
                    <input type="text" name="designation" class="form-control" value="Teacher">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold small">Department</label>
                    <div id="department_input_container">
                        <select id="department_select" name="department_id" class="form-select">
                            <option value="">-- Select Department --</option>
                            <option value="new_department_prompt" class="fw-bold text-primary">+ Add New Manually</option>
                        </select>
                    </div>
                </div>
                
                <div class="col-md-3">
                    <label class="form-label fw-bold small">Joining Date</label>
                    <input type="date" id="hire_date" name="hire_date" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold small">Date of Birth</label>
                    <input type="date" name="date_of_birth" class="form-control">
                </div>
            </div>

            <h5 class="section-title"><i class="fas fa-address-card me-2"></i>Contact & Media</h5>
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Personal Email <span class="text-danger">*</span></label>
                    <input type="email" name="email" class="form-control" required placeholder="email@example.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Mobile Number</label>
                    <input type="tel" name="phone_number" class="form-control" placeholder="+91 XXXX-XXXXXX">
                </div>
                
                <div class="col-12">
                    <label class="form-label fw-bold small">Permanent Address</label>
                    <input type="text" name="address" class="form-control" placeholder="House No, Street, City, ZIP">
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-bold small">Profile Image</label>
                    <input type="file" name="profile_photo" class="form-control" accept="image/*">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Upload CV (PDF/Word)</label>
                    <input type="file" name="cv_file" class="form-control" accept=".pdf,.doc,.docx">
                </div>
            </div>

            <h5 class="section-title"><i class="fas fa-shield-alt me-2"></i>Login Credentials</h5>
            <div class="row g-3 mb-4 p-3 rounded border bg-light">
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Username <span class="text-danger">*</span></label>
                    <input type="text" name="username" class="form-control" required autocomplete="off">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold small">Set Password <span class="text-danger">*</span></label>
                    <input type="password" name="password" class="form-control" required minlength="6">
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <p id="error-msg" class="text-danger fw-bold mb-0"></p>
                <button type="submit" id="submit-button" class="btn btn-primary rounded-pill shadow-sm px-5">
                    <i class="fas fa-save me-2"></i> Save Staff Profile
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/global-config.js?v=2.3.5"></script>

<script>
    // ✅ Use standard keys used in dashboard and login
    const ACTIVE_BRANCH_ID = localStorage.getItem('active_branch_id');
    
    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('erp-token');
        if(!token) window.location.href = '/login.html';

        // Fix the branch context immediately to prevent 'null' API calls
        if (!ACTIVE_BRANCH_ID || ACTIVE_BRANCH_ID === "null") {
            console.error("No Active Branch Found.");
            alert("Please select a branch from the dashboard first.");
            window.location.href = '/admin-dashboard.html';
            return;
        }

        document.getElementById('branch_id').value = ACTIVE_BRANCH_ID;
        document.getElementById('hire_date').value = new Date().toISOString().substring(0, 10);

        // Fetch Data sequentially
        await fetchBranchDetails();
        await fetchAndPopulateDepartments();
    });

    // ✅ Fix: Prevents "undefined" in headers and logs
    async function fetchBranchDetails() {
        try {
            const res = await window.authFetch(`/api/branches/${ACTIVE_BRANCH_ID}`);
            if (res.ok) {
                const branch = await res.json();
                document.getElementById('current-branch-name').innerText = branch.branch_name;
            }
        } catch(e) { 
            document.getElementById('current-branch-name').innerText = "Active Campus";
        }
    }

    // ✅ Fix: Robust sorting to prevent 'localeCompare' errors
    async function fetchAndPopulateDepartments() {
        const sel = document.getElementById('department_select');
        try {
            const res = await window.authFetch('/api/hr/departments');
            if (!res.ok) throw new Error("Dept fetch failed");

            const departments = await res.json();
            if (Array.isArray(departments)) {
                // Clear existing dynamic options
                const existing = sel.querySelectorAll('option:not([value=""]):not([value="new_department_prompt"])');
                existing.forEach(o => o.remove());

                // Sort safely
                departments.sort((a, b) => (a.department_name || "").localeCompare(b.department_name || ""));
                
                departments.forEach(dept => {
                    const opt = document.createElement('option');
                    opt.value = dept.id;
                    opt.textContent = dept.department_name;
                    sel.insertBefore(opt, sel.lastElementChild);
                });
            }
        } catch (err) {
            console.warn('Falling back to manual department input');
            switchToTextInput();
        }
    }

    function switchToTextInput() {
        const container = document.getElementById('department_input_container');
        container.innerHTML = `
            <div class="input-group">
                <input type="text" name="department_name_manual" class="form-control border-primary" placeholder="Type department name..." required>
                <button type="button" class="btn btn-outline-secondary" onclick="location.reload()"><i class="fas fa-sync"></i></button>
            </div>
        `;
    }

    document.getElementById('department_select').addEventListener('change', function(e) {
        if (e.target.value === 'new_department_prompt') switchToTextInput();
    });

    // --- Form Submission Logic ---
    document.getElementById('add-teacher-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-button');
        const originalText = submitBtn.innerHTML;
        
        errorMsg.textContent = '';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Registering...';

        const formData = new FormData(this);

        try {
            const token = localStorage.getItem('erp-token');
            const baseUrl = window.erpSettings?.API_BASE || 'http://localhost:3005';

            const response = await fetch(`${baseUrl}/api/teachers`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });

            const result = await response.json();

            if (response.ok) {
                alert(`SUCCESS: Profile created for ${result.full_name || 'Staff'}`);
                window.location.href = '/view-teachers.html';
            } else {
                throw new Error(result.message || 'Validation failed on server');
            }

        } catch (err) {
            errorMsg.textContent = err.message;
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    });
</script>

</body>
</html>
